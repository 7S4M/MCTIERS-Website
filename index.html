<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/main.css" />
    <title>MC Tiers Leaderboard</title>
</head>
<body>
    <div class="content">
        <header class="navbar">
            <h1 class="title">MC TIERS LEADERBOARD</h1>
            <button class="add-player-btn" onclick="openAddPlayerModal()">
                <i class="ri-add-line"></i> Add Rank
            </button>
        </header>

        <main class="container">
            <div class="leaderboard-wrapper">
                <table class="leaderboard">
                    <thead>
                        <tr>
                            <th>RANK</th>
                            <th>PLAYER NAME</th>
                            <th>RANKS</th>
                            <th>POINTS</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Players will be added here -->
                    </tbody>
                </table>
                <div id="empty-state" class="empty-state">
                    <p>No players yet. Click "Add Rank" to get started!</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Rank Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Rank to Player</h2>
                <button class="close-btn" onclick="closeAddPlayerModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="player-name" placeholder="Enter player name" class="input-field" autocomplete="off">
                <select id="player-rank" class="input-field">
                    <option value="">Select a rank</option>
                    <option value="LT5">LT5 (1 Point)</option>
                    <option value="HT5">HT5 (2 Points)</option>
                    <option value="LT4">LT4 (3 Points)</option>
                    <option value="HT4">HT4 (4 Points)</option>
                    <option value="LT3">LT3 (6 Points)</option>
                    <option value="HT3">HT3 (10 Points)</option>
                    <option value="LT2">LT2 (20 Points)</option>
                    <option value="HT2">HT2 (30 Points)</option>
                    <option value="LT1">LT1 (45 Points)</option>
                    <option value="HT1">HT1 (60 Points)</option>
                </select>
                <div id="rank-count" class="rank-count"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeAddPlayerModal()">Cancel</button>
                <button class="btn-add" onclick="addRank()">Add Rank</button>
            </div>
        </div>
    </div>

    <script src="./JS/script.js"></script>
</body>
</html>
